@if (products() | filterByProperty : 'name' : ''; as productsFromControlFlow) {
<div appScrollWithLoading class="scroll-container" (loadNextData)="loadNextData()">
    @for (product of productsFromControlFlow; track product._id) {
    <!-- <app-card class="card" [product]="product" (click)="navigateToProduct(product._id)"></app-card> -->
    <!-- <app-card class="card" [product]="product" routerLink="/product/id"></app-card> -->
    <!-- <app-card class="card" [product]="product" [routerLink]="['/product/id']"></app-card> -->
    <!-- <app-card class="card" [product]="product" [routerLink]="['/product', product._id]"></app-card> -->
    <app-card class="card" [product]="product" [routerLink]="`/product/${product._id}`"></app-card>
    } @empty { Array is empty }
</div>
} @else {
<mat-spinner></mat-spinner>
}
