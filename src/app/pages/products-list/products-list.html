@if (products(); as productsFromControlFlow) {
<div appScrollWithLoading class="scroll-container" (loadNextData)="loadNextData()">
    @for (product of productsFromControlFlow; track product._id) {
    <app-card class="card" [product]="product"></app-card>
    } @empty { Array is empty }
</div>
} @else {
<mat-spinner></mat-spinner>
}
